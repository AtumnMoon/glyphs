name: Build

# The README "Build" badge points at this workflow, so its status is the
# combined result of every job below on main.
#
#   push to main / pull request   test, race, lint, goreleaser-check
#   push of a v* tag              test, race, lint, then release, but only if
#                                 all three pass (the release itself is the
#                                 GoReleaser run, so the dry run is skipped)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A newer push cancels an older run of the same branch, but a release that
  # is already running is never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # golang.design/x/clipboard is pure Go; CI proves it stays that way.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build -v ./...
      - run: go test -v ./...

      - name: Cross-compile check (FreeBSD)
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=freebsd GOARCH=amd64 go build -o /dev/null ./cmd/glyphs
          GOOS=freebsd GOARCH=arm64 go build -o /dev/null ./cmd/glyphs

  race:
    # The race detector is the only thing here that needs cgo.
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=1 go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Unformatted files:"; echo "$out"; exit 1; fi
      - run: go vet ./...

  goreleaser-check:
    # Dry-runs the release (snapshot, nothing is published) to catch broken
    # paths or config in .goreleaser.yml before you tag.
    name: GoReleaser snapshot
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish

  release:
    name: Release
    # Only for a pushed v* tag, and only when every check above passed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, race, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the archives
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs the tags and history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
