version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: glyphs-build
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    
    ldflags:
      - -s -w
    flags:
      - -trimpath

archives:
  - id: raw-binaries
    ids:
      - glyphs-build
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

  - id: compressed-archives
    ids:
      - glyphs-build
    formats: 
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: 
          - zip

release:
  github:
    owner: AtumnMoon
    name: glyphs
  prerelease: auto

  header: |
    {{ .TagContents }}

changelog:
  use: github
  sort: asc
  filters:
    include:
      - "^feat:"
      - "^fix:"
      - "^refactor:"
  groups:
    - title: '🚀 Features'
      regexp: '^feat(\(.*\))??!?:'
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: '^fix(\(.*\))??!?:'
      order: 1
    - title: '⚙️ Refactors'
      regexp: '^refactor(\(.*\))??!?:'
      order: 2
