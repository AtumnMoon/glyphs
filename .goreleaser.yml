version: 2

before:
  hooks:
    - go mod tidy
    # man pages and shell completions are generated from the command tree
    - sh -c 'rm -rf manpages completions && mkdir -p manpages completions'
    - go run . man manpages
    - sh -c 'go run . completion bash > completions/glyphs.bash'
    - sh -c 'go run . completion zsh > completions/_glyphs'
    - sh -c 'go run . completion fish > completions/glyphs.fish'

builds:
  - id: glyphs-build
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    
    ldflags:
      - -s -w
    flags:
      - -trimpath

archives:
  - id: raw-binaries
    ids:
      - glyphs-build
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

  - id: compressed-archives
    ids:
      - glyphs-build
    formats: 
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - README.md
      - LICENSE
      - src: manpages/*
        dst: man/man1
        strip_parent: true
      - src: completions/*
        dst: completions
        strip_parent: true
      - src: contrib/*
        dst: contrib
        strip_parent: true
    format_overrides:
      - goos: windows
        formats: 
          - zip

release:
  github:
    owner: AtumnMoon
    name: glyphs
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    include:
      - "^feat:"
      - "^fix:"
      - "^refactor:"
  groups:
    - title: '🚀 Features'
      regexp: '^feat(\(.*\))??!?:'
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: '^fix(\(.*\))??!?:'
      order: 1
    - title: '⚙️ Refactors'
      regexp: '^refactor(\(.*\))??!?:'
      order: 2
